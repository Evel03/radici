<!doctype html>
<html lang="it" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="landing.metaTitle"></title>
    <meta name="description" data-i18n-attr="content:landing.metaDescription" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f5ede1" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="__BRAND_NAME__" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:locale:alternate" content="en_IE" />
    <meta property="og:title" data-i18n-attr="content:landing.metaTitle" />
    <meta property="og:description" data-i18n-attr="content:landing.metaDescription" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script type="module" src="/src/pages/landing.ts"></script>
  </head>
  <body>
    <!-- partial:header -->

    <main id="main">
      <section class="hero" aria-labelledby="hero-title">
        <div class="container hero__inner">
          <div class="hero__text">
            <p class="eyebrow" data-i18n="landing.hero.eyebrow"></p>
            <h1 id="hero-title" class="hero__title" data-i18n="landing.hero.title"></h1>
            <p class="hero__lead" data-i18n="landing.hero.lead"></p>
            <div class="actions">
              <a class="btn btn--primary btn--lg" href="/richiesta/" data-i18n="landing.hero.cta"></a>
              <a class="btn btn--ghost btn--lg" href="#how" data-i18n="landing.hero.secondary"></a>
            </div>
            <p class="hero__note" data-i18n="landing.hero.note"></p>
          </div>

          <div class="hero__art">
            <figure class="photo hero__photo">
              <img src="/src/images/cocina.jpg" width="452" height="372" data-i18n-attr="alt:landing.hero.photoAlt" fetchpriority="high" decoding="async" />
            </figure>
            <ul class="hero__labels" data-i18n-attr="aria-label:landing.hero.benefitsLabel">
              <li class="fridge-label">
                <span class="fridge-label__title" data-i18n="landing.hero.label1Title"></span>
                <span class="fridge-label__text" data-i18n="landing.hero.label1Text"></span>
              </li>
              <li class="fridge-label">
                <span class="fridge-label__title" data-i18n="landing.hero.label2Title"></span>
                <span class="fridge-label__text" data-i18n="landing.hero.label2Text"></span>
              </li>
              <li class="fridge-label">
                <span class="fridge-label__title" data-i18n="landing.hero.label3Title"></span>
                <span class="fridge-label__text" data-i18n="landing.hero.label3Text"></span>
              </li>
            </ul>
          </div>
        </div>
      </section>

      <section class="services" aria-labelledby="services-title">
        <div class="container services__inner">
          <h2 id="services-title" class="label services__title" data-i18n="landing.services.title"></h2>
          <ul class="services__list">
            <li class="service">
              <svg class="icon service__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M4 11h16" />
                <path d="M5.5 11v5.5A3.5 3.5 0 0 0 9 20h6a3.5 3.5 0 0 0 3.5-3.5V11" />
                <path d="M2.5 13h3M18.5 13h3" />
                <path d="M6.5 11a5.5 3 0 0 1 11 0" />
                <path d="M12 8V6.5M10.8 6.5h2.4" />
              </svg>
              <span class="service__name" data-i18n="landing.services.weekly"></span>
            </li>
            <li class="service">
              <svg class="icon service__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M3 17.5h18" />
                <path d="M4.5 17.5a7.5 7.5 0 0 1 15 0" />
                <path d="M12 10V8.3M10.5 8.3h3" />
                <path d="M4 20.5h16" />
              </svg>
              <span class="service__name" data-i18n="landing.services.dinners"></span>
            </li>
            <li class="service">
              <svg class="icon service__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <g transform="rotate(8 7.5 17.5)">
                  <path d="M5 4h5l-.4 4.2a2.1 2.1 0 0 1-4.2 0z" />
                  <path d="M7.5 10.3v7.2M5.5 17.5h4" />
                </g>
                <g transform="rotate(-8 16.5 17.5)">
                  <path d="M14 4h5l-.4 4.2a2.1 2.1 0 0 1-4.2 0z" />
                  <path d="M16.5 10.3v7.2M14.5 17.5h4" />
                </g>
              </svg>
              <span class="service__name" data-i18n="landing.services.events"></span>
            </li>
          </ul>
        </div>
      </section>

      <section id="how" class="section" aria-labelledby="how-title">
        <div class="container">
          <div class="section__head section__head--media">
            <div>
              <h2 id="how-title" class="section__title" data-i18n="landing.how.title"></h2>
              <p class="section__intro" data-i18n="landing.how.intro"></p>
            </div>
            <figure class="photo section__photo">
              <img src="/src/images/delantal.jpg" width="438" height="174" data-i18n-attr="alt:landing.how.photoAlt" loading="lazy" decoding="async" />
            </figure>
          </div>
          <ol class="steps">
            <li class="step">
              <svg class="icon step__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M4 4.5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9.5L5 20v-3.5H4a1 1 0 0 1-1-1v-10a1 1 0 0 1 1-1z" />
                <path d="M7.5 9h9M7.5 12.5h6" />
              </svg>
              <h3 class="step__title" data-i18n="landing.how.step1Title"></h3>
              <p data-i18n="landing.how.step1Text"></p>
            </li>
            <li class="step">
              <svg class="icon step__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M6 3h12v18l-3-2-3 2-3-2-3 2z" />
                <path d="M9 8h6M9 11.5h6M9 15h3.5" />
              </svg>
              <h3 class="step__title" data-i18n="landing.how.step2Title"></h3>
              <p data-i18n="landing.how.step2Text"></p>
            </li>
            <li class="step">
              <svg class="icon step__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M4 11h16v4.5a4.5 4.5 0 0 1-4.5 4.5h-7A4.5 4.5 0 0 1 4 15.5z" />
                <path d="M2 11h20" />
                <path d="M9 3.5c-1 1.2 1 2 0 3.5M14 3.5c-1 1.2 1 2 0 3.5" />
              </svg>
              <h3 class="step__title" data-i18n="landing.how.step3Title"></h3>
              <p data-i18n="landing.how.step3Text"></p>
            </li>
            <li class="step">
              <svg class="icon step__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M3 7h18v3H3z" />
                <path d="M4.5 10h15v8a2 2 0 0 1-2 2h-11a2 2 0 0 1-2-2z" />
                <path d="M8 13h8v4H8z" />
              </svg>
              <h3 class="step__title" data-i18n="landing.how.step4Title"></h3>
              <p data-i18n="landing.how.step4Text"></p>
            </li>
          </ol>
        </div>
      </section>

      <section class="section section--alt" aria-labelledby="included-title">
        <div class="container included">
          <figure class="photo included__photo">
            <img src="/src/images/menu.jpg" width="390" height="288" data-i18n-attr="alt:landing.included.photoAlt" loading="lazy" decoding="async" />
          </figure>
          <div class="included__body">
            <h2 id="included-title" class="section__title" data-i18n="landing.included.title"></h2>
            <ul class="checklist">
              <li>
                <svg class="icon checklist__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12.5 9.5 17 19 7.5" /></svg>
                <div>
                  <h3 data-i18n="landing.included.item1Title"></h3>
                  <p data-i18n="landing.included.item1Text"></p>
                </div>
              </li>
              <li>
                <svg class="icon checklist__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12.5 9.5 17 19 7.5" /></svg>
                <div>
                  <h3 data-i18n="landing.included.item2Title"></h3>
                  <p data-i18n="landing.included.item2Text"></p>
                </div>
              </li>
              <li>
                <svg class="icon checklist__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12.5 9.5 17 19 7.5" /></svg>
                <div>
                  <h3 data-i18n="landing.included.item3Title"></h3>
                  <p data-i18n="landing.included.item3Text"></p>
                </div>
              </li>
              <li>
                <svg class="icon checklist__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12.5 9.5 17 19 7.5" /></svg>
                <div>
                  <h3 data-i18n="landing.included.item4Title"></h3>
                  <p data-i18n="landing.included.item4Text"></p>
                </div>
              </li>
              <li>
                <svg class="icon checklist__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12.5 9.5 17 19 7.5" /></svg>
                <div>
                  <h3 data-i18n="landing.included.item5Title"></h3>
                  <p data-i18n="landing.included.item5Text"></p>
                </div>
              </li>
            </ul>
          </div>
        </div>
      </section>

      <section id="prices" class="section" aria-labelledby="pricing-title">
        <div class="container">
          <h2 id="pricing-title" class="section__title" data-i18n="landing.pricing.title"></h2>
          <p class="section__intro" data-i18n="landing.pricing.intro"></p>
          <div class="price-grid">
            <article class="card">
              <h3 class="card__title" data-i18n="landing.pricing.serviceTitle"></h3>
              <p data-i18n="landing.pricing.serviceText"></p>
            </article>
            <article class="card card--olive">
              <h3 class="card__title" data-i18n="landing.pricing.shoppingTitle"></h3>
              <p data-i18n="landing.pricing.shoppingText"></p>
            </article>
            <article class="card">
              <h3 class="card__title" data-i18n="landing.pricing.methodsTitle"></h3>
              <p data-i18n="landing.pricing.methodsText"></p>
            </article>
            <article class="card card--cta">
              <h3 class="card__title" data-i18n="landing.pricing.ctaTitle"></h3>
              <p data-i18n="landing.pricing.ctaText"></p>
              <a class="link-arrow" href="/richiesta/" data-i18n="landing.pricing.ctaLink"></a>
            </article>
          </div>
        </div>
      </section>

      <section class="section section--alt" aria-labelledby="who-title">
        <div class="container">
          <h2 id="who-title" class="section__title" data-i18n="landing.who.title"></h2>
          <div class="who-grid">
            <article class="who">
              <svg class="icon who__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M3 11 12 4l9 7" />
                <path d="M5.5 9.5V20h13V9.5" />
                <path d="M10 20v-5h4v5" />
              </svg>
              <h3 data-i18n="landing.who.familiesTitle"></h3>
              <p data-i18n="landing.who.familiesText"></p>
            </article>
            <article class="who">
              <svg class="icon who__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <rect x="3" y="7" width="18" height="13" rx="2" />
                <path d="M9 7V5.5a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 5.5V7M3 13h18" />
              </svg>
              <h3 data-i18n="landing.who.prosTitle"></h3>
              <p data-i18n="landing.who.prosText"></p>
            </article>
            <article class="who">
              <svg class="icon who__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M12 8c-2-1.6-6.5-1.2-6.5 3.8 0 4.2 3 8.4 6.5 7.4 3.5 1 6.5-3.2 6.5-7.4C18.5 6.8 14 6.4 12 8z" />
                <path d="M12 8c0-2 1-3.5 3-4.5" />
              </svg>
              <h3 data-i18n="landing.who.kidsTitle"></h3>
              <p data-i18n="landing.who.kidsText"></p>
            </article>
          </div>
        </div>
      </section>

      <section id="faq" class="section" aria-labelledby="faq-title">
        <div class="container container--narrow">
          <h2 id="faq-title" class="section__title" data-i18n="landing.faq.title"></h2>
          <div class="faq">
            <details>
              <summary data-i18n="landing.faq.q1"></summary>
              <p data-i18n="landing.faq.a1"></p>
            </details>
            <details>
              <summary data-i18n="landing.faq.qPrice"></summary>
              <p data-i18n="landing.faq.aPrice"></p>
            </details>
            <details>
              <summary data-i18n="landing.faq.qWeeks"></summary>
              <p data-i18n="landing.faq.aWeeks"></p>
            </details>
            <details>
              <summary data-i18n="landing.faq.q2"></summary>
              <p data-i18n="landing.faq.a2"></p>
            </details>
            <details>
              <summary data-i18n="landing.faq.q3"></summary>
              <p data-i18n="landing.faq.a3"></p>
            </details>
            <details>
              <summary data-i18n="landing.faq.q4"></summary>
              <p data-i18n="landing.faq.a4"></p>
            </details>
            <details>
              <summary data-i18n="landing.faq.q5"></summary>
              <p data-i18n="landing.faq.a5"></p>
            </details>
            <details>
              <summary data-i18n="landing.faq.q6"></summary>
              <p data-i18n="landing.faq.a6"></p>
            </details>
          </div>
        </div>
      </section>

      <section class="final-cta" aria-labelledby="final-title">
        <div class="container final-cta__inner">
          <div class="final-cta__text">
            <ul class="values" data-i18n-attr="aria-label:landing.values.label">
              <li data-i18n="landing.values.v1"></li>
              <li data-i18n="landing.values.v2"></li>
              <li data-i18n="landing.values.v3"></li>
              <li data-i18n="landing.values.v4"></li>
            </ul>
            <h2 id="final-title" class="final-cta__title" data-i18n="landing.final.title"></h2>
            <p data-i18n="landing.final.text"></p>
            <a class="btn btn--light btn--lg" href="/richiesta/" data-i18n="landing.final.cta"></a>
          </div>
          <figure class="photo final-cta__photo" aria-hidden="true">
            <img src="/src/images/tarjeta.jpg" width="562" height="174" alt="" loading="lazy" decoding="async" />
          </figure>
        </div>
      </section>
    </main>

    <!-- partial:footer -->
  </body>
</html>
