<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <!--
      Plantilla de public/og-image.png (1200 × 630), la vista previa al compartir un link.
      La dibuja scripts/render-images.mjs con Chrome sin ventana; no se publica. Los marcadores entre llaves
      dobles salen de src/i18n/it.json y de la marca (VITE_BRAND_NAME, por defecto Radici); el de las
      fuentes (fontFaces) trae Cinzel y Cormorant Garamond embebidas (las del sitio, src/styles/fonts.css).
      Identidad del manual de marca: logotipo RADICI / CUCINA PRIVATA, eslogan en itálica, crema y oliva.
      Composición centrada: si una app recorta la imagen al cuadrado, el logotipo y el eslogan quedan enteros.
    -->
    <style>
      {{fontFaces}}

      :root {
        --oliva: #4a5a3c;
        --crema: #f5ede1;
        --terra: #8b6b4f;
        --lino: #dbc9b4;
        --ink: #2c2b20;
        --font-display: "Cinzel Variable", serif;
        --font-serif: "Cormorant Garamond Variable", serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        background: var(--crema);
        color: var(--ink);
      }

      .canvas {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      /* Doble filete como en la papelería: uno terra y otro lino más adentro. */
      .frame {
        position: absolute;
        inset: 26px 26px 44px;
        border: 1px solid var(--terra);
      }

      .frame::after {
        position: absolute;
        inset: 8px;
        border: 1px solid var(--lino);
        content: "";
      }

      .center {
        position: absolute;
        inset: 0 0 18px;
        display: grid;
        place-content: center;
        justify-items: center;
        text-align: center;
      }

      .logo {
        display: grid;
        justify-items: center;
        gap: 18px;
        line-height: 1;
      }

      .logo__name {
        padding: 0 10px 18px;
        border-bottom: 2px solid var(--ink);
        font-family: var(--font-display);
        font-size: 138px;
        font-weight: 500;
        letter-spacing: 0.07em;
      }

      .logo__tag {
        margin-right: -0.34em;
        font-family: var(--font-display);
        font-size: 28px;
        font-weight: 500;
        letter-spacing: 0.34em;
        text-transform: uppercase;
      }

      .slogan {
        margin: 40px 0 0;
        font-family: var(--font-serif);
        font-size: 48px;
        font-style: italic;
        font-weight: 500;
      }

      .eyebrow {
        margin: 26px 0 0;
        color: var(--oliva);
        font-family: var(--font-display);
        font-size: 21px;
        font-weight: 500;
        letter-spacing: 0.26em;
        text-transform: uppercase;
      }

      .band {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 18px;
        background: var(--oliva);
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="frame"></div>
      <div class="center">
        <div class="logo">
          <span class="logo__name">{{brand}}</span>
          <span class="logo__tag">{{tagline}}</span>
        </div>
        <p class="slogan">{{slogan}}</p>
        <p class="eyebrow">{{eyebrow}}</p>
      </div>
      <div class="band"></div>
    </div>
  </body>
</html>
