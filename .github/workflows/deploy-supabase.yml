# Despliega el backend de Supabase a producción: la configuración de Auth (desde config.toml y la
# plantilla del código), migraciones (db push), la cuenta de la cocinera con su horario inicial la
# primera vez, secretos de las Edge Functions, las funciones public-request, chef (el área de Evelyn,
# con la traducción de los platos), menu-reminders (los avisos a Evelyn para completar el menú de cada
# semana, SPEC 5.8) y client-link (el link de la clienta) y, al final, las cuentas de sus colaboradores,
# en cada despliegue.
# Contratos:
# docs/contracts/public-request.md §8 y §10.1, docs/contracts/chef-api.md §9, docs/contracts/client-link.md §8
# y docs/contracts/auth.md (la configuración de Auth que fija este workflow).
# - push a main que toque supabase/** (o este archivo) → producción
# - workflow_dispatch → a mano, desde la pestaña Actions
# Antes de tocar producción corre los tests de TypeScript y los de la base (pgTAP, base local).
# Las migraciones también programan el borrado diario de prospectos vencidos (pg_cron, contrato §9).
#
# Necesita, en Settings → Secrets and variables → Actions del repo:
# - secretos: SUPABASE_ACCESS_TOKEN (token personal de supabase.com/dashboard/account/tokens),
#   SUPABASE_DB_PASSWORD, RESEND_API_KEY, TURNSTILE_SECRET_KEY, IP_HASH_SALT
#   y RESEND_SMTP_KEY (la segunda clave de Resend: SMTP de Auth; en Free, sin SMTP propio Supabase no deja
#   poner la plantilla del código y Evelyn no puede entrar; sin ella el despliegue sigue y avisa)
#   (opcionales: WHATSAPP_TOKEN, CHEF_MEMBER_EMAILS y ANTHROPIC_API_KEY)
#   · ANTHROPIC_API_KEY: la clave de la API de Claude con que la función chef traduce los platos del
#     español al italiano y al inglés (POST /chef/translate, contrato chef-api.md §12). A Anthropic solo
#     van el nombre y la descripción del plato, nunca datos de clientes ni de pedidos. Sin ella la
#     traducción queda apagada (501: Evelyn escribe el italiano y el inglés a mano) y el paso de los
#     secretos avisa. Borrar el secreto de GitHub no la saca de Supabase (los secretos vacíos no se
#     cargan, y nada se borra): para apagar la traducción, supabase secrets unset ANTHROPIC_API_KEY
#     --project-ref <ref>; el paso avisa si sigue en Supabase sin estar en GitHub.
#   · CHEF_MEMBER_EMAILS: los colaboradores de la cocinera (emails separados por coma), cuentas que entran
#     a /gestione/ con el mismo acceso que ella, también a las alergias y las direcciones de los clientes.
#     Solo quien gestiona el sistema por cuenta de Evelyn (SPEC §6, decidido el 16/11/2026): sumar a
#     otra persona exige antes una versión nueva de la privacy y del consentimiento de salud.
#     La lista manda: un email nuevo recibe su cuenta confirmada; uno que sale pierde el acceso y su cuenta
#     se borra (la de una ficha de cliente, o una que no se puede borrar, queda como cuenta de cliente sin
#     sesiones); vacía o sin cargar, ningún colaborador. Cambiar el secreto no hace nada hasta el próximo
#     despliegue: después de editarlo, correr Deploy Supabase a mano (Actions → Deploy Supabase → Run
#     workflow). Va como secreto y no como variable: los valores de las variables salen en claro en el
#     log del paso, y estos emails no se publican.
#   · RESEND_API_KEY también sirve para comprobar que Resend no tiene prendido el seguimiento de clics ni
#     de aperturas (open_tracking y click_tracking de cada dominio): con seguimiento prendido el despliegue
#     corta antes de db push. Lo apaga la dueña de la cuenta de Resend, nunca este workflow. Con una clave
#     «solo de envío» Resend no deja leerlo (restricted_api_key): el paso corta, salvo que la variable
#     RESEND_TRACKING_RESTRICTED_OK sea true (después de mirar el panel). Contrato auth.md §5.
# - variables: SUPABASE_PROJECT_REF, CHEF_NOTIFY_EMAIL, MAIL_FROM, MAIL_REPLY_TO, ALLOWED_ORIGINS,
#   INBOX_URL, PUBLIC_SITE_URL
#   (opcionales: CHEF_LOGIN_EMAIL y CHEF_DISPLAY_NAME para crear la cuenta de la cocinera; CHEF_ID,
#   CHEF_LOCALE, EMAIL_TRANSPORT, WHATSAPP_PHONE_NUMBER_ID, WHATSAPP_TEMPLATE, RESEND_TRACKING_RESTRICTED_OK)
#   · CHEF_ID: sin él no hace falta conocer el id al desplegar: la función usa la única cocinera de
#     public.chefs. Hasta correr promote_to_chef responde 500 (chef_id_unresolved, no_chef). Fijarlo
#     solo si hay más de una cocinera.
#   · CHEF_LOCALE: idioma de los avisos a Evelyn; por defecto es (español).
#   · ALLOWED_ORIGINS: https://radicicucina.app, sin las vistas previas *.pages.dev (se
#     construyen con este mismo backend y crearían pedidos reales; contrato §4). La usa también la
#     función chef: cada origen de la lista puede llamarla con la sesión de Evelyn o de un colaborador.
# Orden del primer despliegue (contrato §10): antes de publicar la web (o una vista previa), las altas
# apagadas y la cuenta de Evelyn creada y confirmada. Lo hace este workflow: Auth en cada despliegue,
# la cuenta (con CHEF_LOGIN_EMAIL y CHEF_DISPLAY_NAME) solo mientras no haya ninguna cocinera, y las de
# sus colaboradores (CHEF_MEMBER_EMAILS) en cada despliegue, al final.
# Sin SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD o SUPABASE_PROJECT_REF corre los tests y no despliega.
# Los secretos vacíos no se cargan (no pisan los que ya estén); para borrar uno (por ejemplo
# CHEF_ID, para volver a la cocinera automática): supabase secrets unset <NOMBRE>.
# Corta antes de cargar valores de desarrollo (la clave de prueba de Turnstile, URLs de localhost) y
# después comprueba que en Supabase estén las obligatorias (TURNSTILE_SECRET_KEY, IP_HASH_SALT) y que
# no esté TRANSLATE_TRANSPORT (traducciones de mentira, solo de desarrollo); si no puede leer la lista
# de secretos, también corta.
# Las actions de terceros van fijadas por SHA (Dependabot las actualiza: .github/dependabot.yml).
name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

# Un despliegue a la vez, y nunca se corta uno a la mitad (db push).
concurrency:
  group: deploy-supabase
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Versión fija del CLI, la misma que CI: se actualiza a propósito, con un PR.
  SUPABASE_CLI_VERSION: "2.121.0"

jobs:
  deploy:
    name: Migraciones, secretos y Edge Function
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Los secretos no se pueden usar en "if"; esto deja un "true"/"false".
      HAS_SUPABASE: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.SUPABASE_DB_PASSWORD != '' && vars.SUPABASE_PROJECT_REF != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Tests de TypeScript (presupuesto, contrato y Edge Function)
        run: npm test

      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Tests de la base (pgTAP)
        run: |
          supabase db start
          supabase test db

      - name: Sin credenciales, no se despliega
        if: env.HAS_SUPABASE != 'true'
        run: echo "::notice::Faltan SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD o la variable SUPABASE_PROJECT_REF. Los tests pasaron, pero no se despliega."

      # El CLI exige el formato de los tokens personales (sbp_ y 40 caracteres en hexadecimal). Al
      # pegarlo en la terminal se puede colar un carácter invisible: se usa el token que contiene el
      # secreto (enmascarado, para los pasos siguientes) y se avisa. Si no tiene ninguno, se dice qué
      # tiene de raro sin mostrarlo.
      - name: Comprobar el token de Supabase
        if: env.HAS_SUPABASE == 'true'
        env:
          RAW_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          token=$(grep -oE 'sbp_[0-9a-f]{40}' <<< "${RAW_TOKEN}" | head -n 1 || true)
          if [ -z "${token}" ]; then
            details="${#RAW_TOKEN} caracteres"
            if [[ "${RAW_TOKEN}" == sbp_* ]]; then details+=", empieza con sbp_"; else details+=", no empieza con sbp_"; fi
            odd=""
            for ((i = 0; i < ${#RAW_TOKEN}; i++)); do
              char="${RAW_TOKEN:i:1}"
              if [[ ! "${char}" =~ ^[a-z0-9_]$ ]]; then
                printf -v code '%04X' "'${char}"
                odd+=" posición ${i}: U+${code};"
              fi
            done
            if [ -n "${odd}" ]; then details+=", caracteres raros:${odd}"; fi
            echo "::error::SUPABASE_ACCESS_TOKEN no contiene un token de Supabase (sbp_ y 40 caracteres): ${details} Volver a cargarlo con gh secret set SUPABASE_ACCESS_TOKEN --body (Get-Clipboard).Trim()."
            exit 1
          fi
          echo "::add-mask::${token}"
          if [ "${token}" != "${RAW_TOKEN}" ]; then
            echo "::warning::El secreto SUPABASE_ACCESS_TOKEN tiene caracteres de más (${#RAW_TOKEN} en lugar de 44): se usa el token que contiene. Conviene volver a cargarlo limpio."
          fi
          echo "SUPABASE_ACCESS_TOKEN=${token}" >> "${GITHUB_ENV}"

      # Antes de guardar nada en Supabase, se le pregunta a cada servicio si la clave sirve, sin mandar
      # ningún email ni mostrarla: una clave pegada mal (otro texto, un carácter de más) se detecta acá
      # y no cuando Evelyn no recibe el código o el formulario rechaza a todos.
      # - Resend: GET /domains con la clave. Una clave válida "solo de envío" responde 401
      #   restricted_api_key; una de acceso completo, 200; una inválida, 400 o 401 "API key is invalid".
      # - Turnstile: siteverify con un token inventado. Con la secreta correcta responde
      #   invalid-input-response; con una incorrecta, invalid-input-secret.
      - name: Comprobar las claves de Resend y Turnstile
        if: env.HAS_SUPABASE == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_SMTP_KEY: ${{ secrets.RESEND_SMTP_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          set -euo pipefail
          problems=0
          response="$(mktemp)"
          trap 'rm -f "${response}"' EXIT
          for name in RESEND_API_KEY RESEND_SMTP_KEY; do
            key="${!name:-}"
            if [ -z "${key}" ]; then
              echo "${name}: no está cargada."
              continue
            fi
            if ! [[ "${key}" =~ ^re_[A-Za-z0-9_]{10,}$ ]]; then
              echo "::error::${name} no parece una clave de Resend (${#key} caracteres; tiene que empezar con re_ y no tener espacios). Volver a cargarla."
              problems=$((problems + 1))
              continue
            fi
            status=$(curl -sS -o "${response}" -w '%{http_code}' https://api.resend.com/domains -H "Authorization: Bearer ${key}")
            name_field=$(jq -r '.name // empty' "${response}" 2>/dev/null || true)
            message=$(jq -r '.message // empty' "${response}" 2>/dev/null || true)
            if [ "${status}" = "200" ] || [ "${name_field}" = "restricted_api_key" ]; then
              echo "${name}: Resend la acepta."
            else
              echo "::error::${name}: Resend no la acepta (${status}: ${message:-sin mensaje}). Crear otra clave y volver a cargarla."
              problems=$((problems + 1))
            fi
          done
          if [ -n "${TURNSTILE_SECRET_KEY:-}" ]; then
            curl -sS -o "${response}" https://challenges.cloudflare.com/turnstile/v0/siteverify \
              --data-urlencode "secret=${TURNSTILE_SECRET_KEY}" \
              --data-urlencode "response=token-de-prueba-del-despliegue"
            codes=$(jq -r '(."error-codes" // []) | join(",")' "${response}" 2>/dev/null || echo "sin respuesta")
            if [[ ",${codes}," == *",invalid-input-secret,"* ]] || [[ ",${codes}," == *",missing-input-secret,"* ]]; then
              echo "::error::TURNSTILE_SECRET_KEY: Cloudflare no la reconoce (${codes}). Volver a cargar la Secret Key del widget."
              problems=$((problems + 1))
            else
              echo "TURNSTILE_SECRET_KEY: Cloudflare la reconoce (${codes:-sin códigos})."
            fi
          else
            echo "TURNSTILE_SECRET_KEY: no está cargada."
          fi
          if [ "${problems}" -gt 0 ]; then
            exit 1
          fi

      - name: Vincular el proyecto
        if: env.HAS_SUPABASE == 'true'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "${SUPABASE_PROJECT_REF}"

      # Antes de tocar Auth: Resend no puede tener prendido el seguimiento de aperturas ni de clics
      # (reescribiría los links de los emails de Auth y vería los tokens). Solo lee, con la clave que ya
      # existe; apagarlo lo hace la dueña de la cuenta de Resend. Corta antes de db push
      # (supabase/scripts/resend-tracking.ts, con tests; contrato auth.md §5).
      - name: Seguimiento de Resend apagado
        if: env.HAS_SUPABASE == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_READ_KEY || secrets.RESEND_API_KEY }}
          RESEND_TRACKING_RESTRICTED_OK: ${{ vars.RESEND_TRACKING_RESTRICTED_OK }}
        run: node supabase/scripts/resend-tracking.ts

      # Antes del PATCH que prende el hook de la cocina (auth.md §8): la función tiene que existir en producción,
      # ser security definer y ejecutarla solo supabase_auth_admin. Se mira la base por la Management API (solo
      # lectura). Si no está bien, corta antes de tocar Auth: un hook prendido que apunta a una función que no
      # está dejaría a Evelyn sin entrar (supabase/scripts/auth-hook-check.ts, con tests).
      - name: "Hook de la cocina: la función existe"
        if: env.HAS_SUPABASE == 'true'
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: node supabase/scripts/auth-hook-check.ts

      # Antes que nada, las altas apagadas y el resto de lo fijo de Auth. Tres PATCH
      # (supabase/scripts/auth-config.ts): security siempre; smtp y templates solo con RESEND_SMTP_KEY,
      # porque en un proyecto Free Supabase no deja cambiar las plantillas sin SMTP propio (el email
      # traería un link y no el código). Los cuerpos van directo del script al curl, y la respuesta (la
      # configuración entera, con la clave del SMTP) queda en un archivo que solo leen jq y auth-config.ts:
      # nada de eso se imprime. Después de cada PATCH se compara lo que Supabase guardó con el cuerpo
      # (auth-config.ts verify): un campo distinto, o un nombre de campo que la API ignoró, corta antes de
      # db push. Una sola vez (mientras haya algo que cambiar) el resumen del paso anota, sin valores, la
      # versión de GoTrue y los nombres de los campos de producción que cambian (contrato auth.md §3).
      - name: Auth desde el repo (altas, código, SMTP y plantilla)
        if: env.HAS_SUPABASE == 'true'
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          RESEND_SMTP_KEY: ${{ secrets.RESEND_SMTP_KEY }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "${response}"' EXIT
          api="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}"
          all_changed=""
          # La configuración vigente, antes del primer PATCH: de ahí salen los campos que cambian.
          status=$(curl -sS -o "${response}" -w '%{http_code}' -X GET "${api}/config/auth" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}")
          if [ "${status}" != "200" ]; then
            echo "::error::La Management API respondió ${status} al leer la configuración de Auth."
            exit 1
          fi
          patch() {
            local body status changed
            body=$(node supabase/scripts/auth-config.ts "$1")
            changed=$(node supabase/scripts/auth-config.ts changed "$1" < "${response}" | tr '\n' ' ')
            all_changed="${all_changed}${changed}"
            status=$(curl -sS -o "${response}" -w '%{http_code}' \
              -X PATCH "${api}/config/auth" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary @- <<< "${body}")
            if [ "${status}" != "200" ]; then
              echo "::error::La Management API respondió ${status} al configurar Auth (${1}): $(jq -r '.message // .error // "sin mensaje"' "${response}" 2>/dev/null || echo "sin mensaje")"
              exit 1
            fi
            # Lo que Supabase guardó tiene que ser lo pedido, campo por campo (solo nombres en el error).
            if ! node supabase/scripts/auth-config.ts verify "$1" < "${response}"; then
              echo "::error::Auth no quedó como pide el repo (${1}): revisar los nombres de campo de la Management API."
              exit 1
            fi
          }
          note_summary() {
            local version
            version=$(curl -sS -m 20 "${api}/health?services=auth" -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" | jq -r '.[0].info.version // empty' 2>/dev/null || true)
            if [ -z "${version}" ]; then
              echo "::warning::No se pudo leer la versión de GoTrue (no cambia nada: es solo para el resumen)."
              version="no disponible"
            fi
            if [ -n "${all_changed// /}" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              echo "### Auth desde el repo" >> "${GITHUB_STEP_SUMMARY}"
              echo "- Versión de GoTrue: ${version}" >> "${GITHUB_STEP_SUMMARY}"
              echo "- Campos de producción que cambian (solo nombres): ${all_changed}" >> "${GITHUB_STEP_SUMMARY}"
            fi
          }
          patch security
          if ! jq -e '.disable_signup == true' "${response}" > /dev/null; then
            echo "::error::Auth no quedó con las altas apagadas."
            exit 1
          fi
          if [ -z "${RESEND_SMTP_KEY:-}" ]; then
            echo "::warning::Sin RESEND_SMTP_KEY no hay SMTP propio: en un proyecto Free Supabase no deja cambiar la plantilla y el email trae un link en lugar del código, así que Evelyn todavía no puede entrar a la app. Cargar la segunda clave de Resend y volver a desplegar."
            note_summary
            exit 0
          fi
          patch smtp
          patch templates
          # Si Supabase ignorara la plantilla (plan o SMTP), el despliegue tiene que fallar, no quedar verde.
          if ! jq -e --rawfile template supabase/templates/login_code.html \
            '.mailer_templates_magic_link_content == $template and .mailer_templates_confirmation_content == $template' \
            "${response}" > /dev/null; then
            echo "::error::Supabase no guardó la plantilla del código: el email traería un link en lugar del código."
            exit 1
          fi
          note_summary

      - name: Migraciones (db push)
        id: db_push
        if: env.HAS_SUPABASE == 'true'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        # Solo migraciones: nunca el seed (son datos de desarrollo).
        run: supabase db push --yes

      # Solo mientras no haya ninguna cocinera (supabase/scripts/deploy-accounts.sh chef, con tests): su
      # cuenta, promote_to_chef (que le pone una contraseña al azar y le cierra las sesiones, así que nunca
      # corre otra vez) y su horario inicial (private.add_default_availability, contrato §11.1). La cuenta
      # nace confirmada, con una contraseña al azar que nadie conoce (entra con el código por email) y con
      # el idioma de los avisos para el email del código. La clave secreta del proyecto solo vive en este
      # paso, enmascarada. Las de sus colaboradores van al final («Colaboradores de la cocinera»).
      - name: Cuenta de la cocinera (solo la primera vez)
        if: env.HAS_SUPABASE == 'true'
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          CHEF_LOGIN_EMAIL: ${{ vars.CHEF_LOGIN_EMAIL }}
          CHEF_DISPLAY_NAME: ${{ vars.CHEF_DISPLAY_NAME }}
          CHEF_LOCALE: ${{ vars.CHEF_LOCALE }}
        run: bash supabase/scripts/deploy-accounts.sh chef

      - name: Secretos de la función
        if: env.HAS_SUPABASE == 'true'
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          IP_HASH_SALT: ${{ secrets.IP_HASH_SALT }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CHEF_ID: ${{ vars.CHEF_ID }}
          CHEF_NOTIFY_EMAIL: ${{ vars.CHEF_NOTIFY_EMAIL }}
          CHEF_LOCALE: ${{ vars.CHEF_LOCALE }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_REPLY_TO: ${{ vars.MAIL_REPLY_TO }}
          EMAIL_TRANSPORT: ${{ vars.EMAIL_TRANSPORT }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          INBOX_URL: ${{ vars.INBOX_URL }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ vars.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TEMPLATE: ${{ vars.WHATSAPP_TEMPLATE }}
        run: |
          set -euo pipefail
          # Valores de desarrollo (supabase/functions/.env.example) en producción: se corta antes de cargarlos.
          # La clave de prueba de Turnstile rechaza los tokens reales (y acepta el de prueba).
          if [[ "${TURNSTILE_SECRET_KEY:-}" =~ ^[123]x0+AA$ ]]; then
            echo "::error::TURNSTILE_SECRET_KEY es una clave de prueba de Turnstile: cargar la secreta del widget de producción."
            exit 1
          fi
          for name in ALLOWED_ORIGINS INBOX_URL PUBLIC_SITE_URL; do
            if [[ "${!name:-}" =~ (localhost|127\.0\.0\.1) ]]; then
              echo "::error::${name} apunta a localhost: es un valor de desarrollo."
              exit 1
            fi
          done
          if [ "${EMAIL_TRANSPORT:-}" = "log" ]; then
            echo "::warning::EMAIL_TRANSPORT=log: la función no manda ningún email (solo los registra). En producción, borrar la variable."
          fi
          if [[ "${CHEF_ID:-}" == cef00000-* ]]; then
            echo "::warning::CHEF_ID es el de la cocinera del seed de desarrollo: la función respondería 500 (chef_not_found). Borrar la variable para usar la única cocinera."
          fi

          # Cada valor viaja como un argumento NOMBRE=valor (sin pasar por un .env ni por echo).
          pairs=()
          for name in RESEND_API_KEY TURNSTILE_SECRET_KEY IP_HASH_SALT WHATSAPP_TOKEN ANTHROPIC_API_KEY \
                      CHEF_ID CHEF_NOTIFY_EMAIL CHEF_LOCALE MAIL_FROM MAIL_REPLY_TO EMAIL_TRANSPORT \
                      ALLOWED_ORIGINS INBOX_URL PUBLIC_SITE_URL WHATSAPP_PHONE_NUMBER_ID WHATSAPP_TEMPLATE; do
            value="${!name:-}"
            if [ -n "${value}" ]; then
              pairs+=("${name}=${value}")
            fi
          done
          # CHEF_ID no está: es opcional (sin él, la única cocinera de public.chefs).
          missing=()
          for name in TURNSTILE_SECRET_KEY IP_HASH_SALT RESEND_API_KEY MAIL_FROM CHEF_NOTIFY_EMAIL ALLOWED_ORIGINS; do
            if [ -z "${!name:-}" ]; then
              missing+=("${name}")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::warning::Faltan ${missing[*]}: sin ellos la función no atiende pedidos o no manda los emails."
          fi
          if [[ "${ALLOWED_ORIGINS:-}" == *".pages.dev"* ]]; then
            echo "::warning::ALLOWED_ORIGINS incluye una vista previa *.pages.dev: desde ahí se crean pedidos reales. Sacarla al terminar la prueba."
          fi
          if [ "${#pairs[@]}" -gt 0 ]; then
            supabase secrets set --project-ref "${SUPABASE_PROJECT_REF}" "${pairs[@]}"
          fi

          # Lo que tiene que estar en Supabase (cargado acá o antes, a mano) y lo que no puede estar. Solo
          # se leen los nombres, nunca los valores. Si no se puede leer la lista, el despliegue corta: sin
          # ella no se puede comprobar ni lo uno ni lo otro.
          if ! listing=$(supabase secrets list --project-ref "${SUPABASE_PROJECT_REF}" -o json); then
            echo "::error::No se pudo leer la lista de secretos de la función (supabase secrets list falló): no se puede comprobar que estén TURNSTILE_SECRET_KEY e IP_HASH_SALT ni que falte TRANSLATE_TRANSPORT. Volver a correr el despliegue."
            exit 1
          fi
          names=$(jq -r '.. | objects | select(has("name")) | .name' <<< "${listing}" 2>/dev/null || true)
          if [ -z "${names}" ]; then
            echo "::error::La lista de secretos de la función vino vacía o con otro formato: no se puede comprobar que estén TURNSTILE_SECRET_KEY e IP_HASH_SALT ni que falte TRANSLATE_TRANSPORT."
            exit 1
          fi
          # Sin las obligatorias la función responde 500 a todos los pedidos.
          absent=()
          for name in TURNSTILE_SECRET_KEY IP_HASH_SALT; do
            grep -qx "${name}" <<< "${names}" || absent+=("${name}")
          done
          if [ "${#absent[@]}" -gt 0 ]; then
            echo "::error::Faltan en Supabase los secretos ${absent[*]}: la función respondería 500 a todos los pedidos."
            exit 1
          fi
          # TRANSLATE_TRANSPORT=fake es solo de desarrollo (traducciones de mentira): este workflow nunca
          # lo carga, y si alguien lo cargó a mano el despliegue corta. (La función, además, lo ignora
          # fuera de un Supabase local.)
          if grep -qx "TRANSLATE_TRANSPORT" <<< "${names}"; then
            echo "::error::TRANSLATE_TRANSPORT está en los secretos de Supabase: es solo de desarrollo (traducciones de mentira). Borrarlo con supabase secrets unset TRANSLATE_TRANSPORT --project-ref <ref> y volver a desplegar."
            exit 1
          fi
          # Opcional: sin la clave de Claude la función chef no traduce los platos. Borrarla de GitHub no
          # la saca de Supabase: se avisa para que no quede prendida sin querer.
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            if grep -qx "ANTHROPIC_API_KEY" <<< "${names}"; then
              echo "::notice::ANTHROPIC_API_KEY no está en GitHub pero sigue en los secretos de Supabase: la traducción de los platos sigue prendida. Para apagarla: supabase secrets unset ANTHROPIC_API_KEY --project-ref <ref>."
            else
              echo "::warning::Sin ANTHROPIC_API_KEY la traducción automática de los platos queda apagada: POST /chef/translate responde 501 y Evelyn escribe el italiano y el inglés a mano. Cargar el secreto en GitHub y volver a desplegar."
            fi
          fi

      - name: Desplegar public-request
        if: env.HAS_SUPABASE == 'true'
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        # verify_jwt = false sale de supabase/config.toml ([functions.public-request]).
        # --use-api: el bundle lo arma Supabase, sin Docker.
        run: supabase functions deploy public-request --project-ref "${SUPABASE_PROJECT_REF}" --use-api

      # El área de Evelyn (docs/contracts/chef-api.md): reservas, mover y cancelar sesiones, y la
      # traducción de los platos. Va después de db push porque llama a las funciones chef_* de la
      # migración de reservas (y a chef_id_for_user, de la de colaboradores). verify_jwt = true sale de
      # supabase/config.toml ([functions.chef]): la plataforma exige un JWT y la función valida además
      # que sea de la cocinera o de un colaborador suyo (public.chef_id_for_user). Usa ALLOWED_ORIGINS
      # (la misma variable que public-request) y ANTHROPIC_API_KEY (opcional: sin ella no traduce), las
      # dos cargadas en "Secretos de la función", y la URL y la clave secreta que pone Supabase.
      # Cualquier origen de ALLOWED_ORIGINS puede llamarla con
      # la sesión de Evelyn o de un colaborador: avisa si hay alguno además del de PUBLIC_SITE_URL (por
      # ejemplo, un dominio viejo).
      - name: Desplegar chef
        if: env.HAS_SUPABASE == 'true'
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: |
          set -euo pipefail
          if [ -n "${PUBLIC_SITE_URL:-}" ] && [ -n "${ALLOWED_ORIGINS:-}" ]; then
            site="${PUBLIC_SITE_URL%/}"
            extra=()
            IFS=',' read -ra origins <<< "${ALLOWED_ORIGINS}"
            for origin in "${origins[@]}"; do
              origin="$(xargs <<< "${origin}")"
              origin="${origin%/}"
              if [ -n "${origin}" ] && [ "${origin}" != "${site}" ]; then
                extra+=("${origin}")
              fi
            done
            if [ "${#extra[@]}" -gt 0 ]; then
              echo "::warning::ALLOWED_ORIGINS tiene orígenes además de ${site} (${extra[*]}): desde ellos también se puede usar la función chef con la sesión de Evelyn o de un colaborador. Dejar solo el del sitio (contrato chef-api.md §2)."
            fi
          fi
          supabase functions deploy chef --project-ref "${SUPABASE_PROJECT_REF}" --use-api

      # El link de la clienta (docs/contracts/client-link.md): la página /prenotazione/ muestra la reserva
      # con el menú de cada semana y la clienta lo confirma o pide cambios. Va después de db push porque
      # llama a las funciones client_link_* (migración 20261121100000_menu_sends.sql). verify_jwt = false
      # sale de supabase/config.toml ([functions.client-link]): la clienta no tiene cuenta y la llave es el
      # token del link. Usa los secretos que ya carga "Secretos de la función" (IP_HASH_SALT,
      # ALLOWED_ORIGINS y los de los avisos a Evelyn), y la URL y la clave secreta que pone Supabase.
      - name: Desplegar client-link
        if: env.HAS_SUPABASE == 'true'
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy client-link --project-ref "${SUPABASE_PROJECT_REF}" --use-api

      # Los avisos a Evelyn para completar el menú de cada semana (SPEC 5.8). La base llama a la función
      # cada 15 minutos (pg_cron + pg_net, migración 20261121110000_menu_reminders.sql) con un secreto
      # compartido en la cabecera x-reminders-secret. Este paso genera uno nuevo en cada despliegue, lo
      # carga como secreto de la función (MENU_REMINDERS_SECRET) y lo guarda en Vault junto con la URL de
      # la función (private.upsert_vault_secret, por SQL con la Management API como postgres). Si un
      # turno de pg_cron cae justo en medio, ese turno recibe 401 y el siguiente ya anda. El secreto se
      # enmascara (::add-mask::) y viaja como argumento o por la entrada de curl, nunca en un archivo.
      # verify_jwt = false sale de supabase/config.toml ([functions.menu-reminders]). Usa CHEF_NOTIFY_EMAIL,
      # CHEF_LOCALE, MAIL_FROM, RESEND_API_KEY, INBOX_URL, EMAIL_TRANSPORT y CHEF_ID, cargados en
      # "Secretos de la función".
      - name: Desplegar menu-reminders (avisos del menú)
        if: env.HAS_SUPABASE == 'true'
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase functions deploy menu-reminders --project-ref "${SUPABASE_PROJECT_REF}" --use-api
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::${secret}"
          supabase secrets set --project-ref "${SUPABASE_PROJECT_REF}" "MENU_REMINDERS_SECRET=${secret}"
          url="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/menu-reminders"
          # El secreto es hexadecimal y la URL sale del ref del proyecto: ninguno tiene comillas.
          query="select private.upsert_vault_secret('radici_menu_reminders_url', '${url}'), private.upsert_vault_secret('radici_menu_reminders_secret', '${secret}');"
          if ! out=$(jq -n --arg query "${query}" '{query: $query}' \
              | curl -sS --fail-with-body -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
                  -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
                  -H "Content-Type: application/json" \
                  --data-binary @-); then
            echo "::error::No se pudieron guardar la URL y el secreto de los avisos en Vault: $(jq -r '.message // .error // "sin mensaje"' <<< "${out}" 2>/dev/null || echo "sin mensaje"). Los avisos del menú no salen hasta el próximo despliegue."
            exit 1
          fi

      # Los colaboradores de la cocinera, en cada despliegue (supabase/scripts/deploy-accounts.sh members,
      # con tests): la lista del secreto CHEF_MEMBER_EMAILS manda (la valida y la convierte en SQL
      # supabase/scripts/chef-members.ts). Crea las cuentas que faltan (confirmadas, como la de la cocinera)
      # y private.sync_chef_members agrega a los que faltan y saca a los que ya no están: pierden el acceso
      # y su cuenta de Auth se borra (la de una ficha de cliente, o una que no se puede borrar, queda como
      # cuenta de cliente sin sesiones). Después cuenta los usuarios de Auth: la cocinera y sus
      # colaboradores. Es un secreto y no una variable porque los valores de las variables salen en claro
      # en el log del paso; además cada email se enmascara (::add-mask::) antes de usarlo y los mensajes
      # dicen solo la versión enmascarada.
      # Va al final para que un error en la lista (un email mal escrito, una cuenta sin confirmar) deje el
      # despliegue en rojo sin dejar la base migrada con las funciones viejas. Corre aunque haya fallado un
      # paso anterior (por ejemplo, los secretos), siempre que db push haya salido bien: una baja de la
      # lista no espera a que se arregle otra cosa.
      - name: Colaboradores de la cocinera
        if: ${{ !cancelled() && env.HAS_SUPABASE == 'true' && steps.db_push.outcome == 'success' }}
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          CHEF_LOGIN_EMAIL: ${{ vars.CHEF_LOGIN_EMAIL }}
          CHEF_LOCALE: ${{ vars.CHEF_LOCALE }}
          CHEF_MEMBER_EMAILS: ${{ secrets.CHEF_MEMBER_EMAILS }}
        run: bash supabase/scripts/deploy-accounts.sh members

      - name: Resumen
        if: env.HAS_SUPABASE == 'true'
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          {
            echo "### Backend desplegado"
            echo "- Migraciones aplicadas con db push"
            echo "- Funciones: https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/public-request, …/functions/v1/chef, …/functions/v1/client-link y …/functions/v1/menu-reminders"
          } >> "${GITHUB_STEP_SUMMARY}"
