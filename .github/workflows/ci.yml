name: CI

on:
  pull_request:
  push:
    branches: [main]

# Solo lectura: ningún job escribe en el repo. Las actions de terceros van fijadas por SHA
# (Dependabot las actualiza: .github/dependabot.yml).
permissions:
  contents: read

jobs:
  quote:
    name: Motor de presupuesto (TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm test

  edge-functions:
    name: Edge Functions (deno check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.8
      # Los tipos de las funciones con sus dependencias reales (supabase-js y el SDK de Anthropic).
      # chef carga claude_translator.ts con un import dinámico: va explícito. --node-modules-dir=none:
      # el package.json de la raíz es de los tests de Node, no de las funciones. --no-lock: el repo no
      # tiene deno.lock (las versiones van fijas en cada import npm:).
      - run: >-
          deno check --no-lock --node-modules-dir=none
          supabase/functions/chef/index.ts
          supabase/functions/chef/claude_translator.ts
          supabase/functions/public-request/index.ts
          supabase/functions/menu-reminders/index.ts

  web:
    name: Web pública
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  app:
    name: App Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter analyze
      - run: flutter test

  database:
    name: Base de datos (RLS y no_overlap)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.121.0
      - run: supabase db start
      - run: supabase test db
