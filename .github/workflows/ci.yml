name: CI

on:
  pull_request:
  push:
    branches: [main]

# Solo lectura: ningún job escribe en el repo. Las actions de terceros van fijadas por SHA
# (Dependabot las actualiza: .github/dependabot.yml).
permissions:
  contents: read

jobs:
  # Gasta pocos minutos (los de Actions son limitados): en un PR, cada job pesado corre solo si cambió
  # algo de lo que usa (reglas en .github/scripts/ci-changes.sh, con tests; si algo falla, corren todos).
  # En push a main corren todos.
  changes:
    name: Qué cambió
    runs-on: ubuntu-latest
    outputs:
      quote: ${{ steps.areas.outputs.quote }}
      edge: ${{ steps.areas.outputs.edge }}
      web: ${{ steps.areas.outputs.web }}
      app: ${{ steps.areas.outputs.app }}
      database: ${{ steps.areas.outputs.database }}
    steps:
      # Historia completa: git diff necesita la base del PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: areas
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A prueba de fallos: sin base, con un git diff roto o con un script que falla, corre todo.
          set -uo pipefail
          all() { printf '%s\n' quote=true edge=true web=true app=true database=true | tee -a "${GITHUB_OUTPUT}"; }
          if [ "${EVENT}" != "pull_request" ]; then
            all
            exit 0
          fi
          # quotepath=off: nombres con acentos tal cual (si no, git los escapa y no coinciden con nada);
          # --no-renames: un archivo movido cuenta con su ruta vieja y con la nueva.
          if ! git -c core.quotepath=off diff --name-only --no-renames "${BASE_SHA}...${HEAD_SHA}" > "${RUNNER_TEMP}/changed.txt"; then
            echo "::warning::No se pudo calcular qué cambió: corren todos los jobs."
            all
            exit 0
          fi
          cat "${RUNNER_TEMP}/changed.txt"
          if ! areas=$(bash .github/scripts/ci-changes.sh < "${RUNNER_TEMP}/changed.txt"); then
            echo "::warning::ci-changes.sh falló: corren todos los jobs."
            all
            exit 0
          fi
          echo "${areas}" | tee -a "${GITHUB_OUTPUT}"

  quote:
    name: Motor de presupuesto (TS)
    needs: changes
    if: needs.changes.outputs.quote == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm test

  edge-functions:
    name: Edge Functions (deno check)
    needs: changes
    if: needs.changes.outputs.edge == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.8
      # Los tipos de las tres funciones con sus dependencias reales (supabase-js y el SDK de Anthropic).
      # chef carga claude_translator.ts con un import dinámico: va explícito. --node-modules-dir=none:
      # el package.json de la raíz es de los tests de Node, no de las funciones. --no-lock: el repo no
      # tiene deno.lock (las versiones van fijas en cada import npm:).
      - run: >-
          deno check --no-lock --node-modules-dir=none
          supabase/functions/chef/index.ts
          supabase/functions/chef/claude_translator.ts
          supabase/functions/public-request/index.ts
          supabase/functions/client-link/index.ts

  web:
    name: Web pública
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  app:
    name: App Flutter
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter analyze
      - run: flutter test

  database:
    name: Base de datos (RLS y no_overlap)
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.121.0
      - run: supabase db start
      - run: supabase test db
