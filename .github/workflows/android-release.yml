# Compila el Android App Bundle (AAB) firmado para Google Play, con la configuración de producción, y
# lo deja como artefacto (14 días). NO sube nada a Play: Google exige que la PRIMERA subida de una app
# nueva se haga a mano por Play Console (ver app/README.md, «Publicar en Android»). Las subidas
# automáticas vendrán después, con una cuenta de servicio de Play.
# - workflow_dispatch: build firmado + artefacto. Input opcional «build_name» (versión visible, ej.
#   1.0.0; vacío = la de pubspec.yaml).
# - pull_request: el mismo build, solo si cambia este workflow o los archivos de firma de Android
#   (valida que la firma y el build anden; no publica nada). Los PR de forks no reciben secretos y
#   fallan en el primer paso: es lo esperado.
# Build number (versionCode) = github.run_number + BUILD_NUMBER_OFFSET. Play exige un versionCode
# siempre creciente; el offset fijo deja espacio por si hubo subidas manuales antes. Si hace falta,
# se sube a propósito (nunca se baja).
# Secretos: ANDROID_UPLOAD_KEYSTORE_BASE64 (PKCS12), ANDROID_UPLOAD_KEYSTORE_PASSWORD,
# ANDROID_UPLOAD_KEY_ALIAS, ANDROID_UPLOAD_KEY_PASSWORD; variables SUPABASE_URL y SUPABASE_PUBLISHABLE_KEY
# (las mismas que usa deploy-web.yml para /gestione/). Si falta cualquiera, el workflow falla.
name: Android release

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: "Versión visible (build name), ej. 1.0.0. Vacío = la de pubspec.yaml"
        required: false
        default: ""
  pull_request:
    paths:
      - ".github/workflows/android-release.yml"
      - "app/android/app/build.gradle.kts"
      - "app/android/build.gradle.kts"
      - "app/android/settings.gradle.kts"
      - "app/android/gradle.properties"

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.7"
  BUILD_NUMBER_OFFSET: "100"

jobs:
  bundle:
    name: AAB firmado
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      RADICI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      RADICI_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      RADICI_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
      RADICI_REQUIRE_RELEASE_SIGNING: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Comprobar secretos y configuración
        run: |
          missing=()
          for name in KEYSTORE_B64 RADICI_KEYSTORE_PASSWORD RADICI_KEY_ALIAS RADICI_KEY_PASSWORD SUPABASE_URL SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then missing+=("${name}"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Faltan secretos/variables del repo: ${missing[*]}"
            exit 1
          fi
          case "${SUPABASE_PUBLISHABLE_KEY}" in
            sb_publishable_*) ;;
            *) echo "::error::SUPABASE_PUBLISHABLE_KEY no es una clave publicable (sb_publishable_...)."; exit 1 ;;
          esac

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # El código generado (freezed, json, l10n) no se versiona.
      - name: App - dependencias y código generado
        working-directory: app
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n

      # El keystore se decodifica en el directorio temporal del runner (fuera del repo) y se borra al final.
      - name: Decodificar el keystore
        run: |
          keystore="${RUNNER_TEMP}/radici-upload.p12"
          umask 077
          printf '%s' "${KEYSTORE_B64}" | base64 --decode > "${keystore}"
          echo "RADICI_KEYSTORE_PATH=${keystore}" >> "${GITHUB_ENV}"

      - name: Compilar el AAB
        working-directory: app
        env:
          BUILD_NAME_INPUT: ${{ inputs.build_name }}
        run: |
          build_number=$(( GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET ))
          args=(--release "--build-number=${build_number}")
          if [ -n "${BUILD_NAME_INPUT}" ]; then
            if ! [[ "${BUILD_NAME_INPUT}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::build_name debe ser X.Y.Z"
              exit 1
            fi
            args+=("--build-name=${BUILD_NAME_INPUT}")
          fi
          echo "versionCode: ${build_number}"
          flutter build appbundle "${args[@]}" \
            --dart-define=APP_ENV=prod \
            "--dart-define=SUPABASE_URL=${SUPABASE_URL}" \
            "--dart-define=SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}"

      - name: Verificar la firma del AAB
        run: |
          aab=app/build/app/outputs/bundle/release/app-release.aab
          jarsigner -verify "${aab}" | grep -q "jar verified" || { echo "::error::El AAB no está firmado."; exit 1; }
          keytool -printcert -jarfile "${aab}" | grep "SHA256:"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: radici-android-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
          if-no-files-found: error

      - name: Borrar el keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/radici-upload.p12"
