name: mestolo
description: "Cucina di casa a domicilio"
# Paquete privado: nunca se publica en pub.dev.
publish_to: 'none'

# versión+build. En las tiendas se puede pisar con --build-name y --build-number.
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.1.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.2
  flutter_lints: ^6.0.0
  freezed: ^4.0.3
  json_serializable: ^6.14.1
  mocktail: ^1.0.5

flutter:
  # Genera AppLocalizations a partir de lib/l10n/*.arb (ver l10n.yaml).
  generate: true
  uses-material-design: true
